version: '3.8'
services:
  backend:
    build:
      context: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      ROCKET_DATABASES: "{postgres_db={url=\"postgres://rudrist_admin:${POSTGRES_PASSWORD}@db:5432/rudristdb\"}}"
      ROCKET_SECRET_KEY: ${ROCKET_SECRET_KEY:?set ROCKET_SECRET_KEY in .env}
      ROCKET_PORT: 8080
    networks:
      - rudrist-network
  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rudrist_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rudristdb
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rudrist-network

networks:
  rudrist-network:
    driver: bridge
volumes:
  postgres_data:
